[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pykbroker"
version = "0.1.0"
description = "Unified Python SDK and read-first MCP server for Korean stock brokers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Quantus Technologies" }]
keywords = ["broker", "korea", "stocks", "kis", "dbfi", "mcp", "korea-stock", "kis-api", "korea-investment", "db-securities", "toss-securities", "broker-api", "trading-sdk", "mcp-server", "quant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
# These vendor source trees have no compatible published distribution.
# Supply Pykis/Pydb on the import path or inject a client (see getting-started).
kis = ["requests>=2.28", "SQLAlchemy>=1.4", "websocket-client>=1.4", "pycryptodome>=3.15", "colorlog>=6.7"]
dbfi = ["requests>=2.28", "pandas>=2"]
toss = ["httpx>=0.27", "pydantic-settings>=2"]
mcp = ["mcp[cli]>=1.0,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "build>=1"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "pymdown-extensions>=10", "markdown-it-py>=3"]

[project.scripts]
pykbroker = "pykbroker.cli:main"
pykbroker-mcp = "pykbroker.mcp.server:run_server"

[project.urls]
Homepage = "https://www.quantus.kr/q"
Documentation = "https://stoa-company.github.io/pykbroker/"
Source = "https://github.com/STOA-company/pykbroker"
Changelog = "https://github.com/STOA-company/pykbroker/blob/main/CHANGELOG.md"
Repository = "https://github.com/STOA-company/pykbroker"
Issues = "https://github.com/STOA-company/pykbroker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pykbroker"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
