name: ci

on:
  pull_request:
  push:
    branches: [main, "integ/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # toss_openapi is a vendored source tree (not on PyPI) in the private repo
      # STOA-company/toss-openapi. Secret TOSS_OPENAPI_DEPLOY_KEY is the private half of a
      # read-only deploy key registered on that one repo (no write, no other repos, no expiry).
      # No secret => fail loudly: green must mean the Toss SDK tests ran.
      - name: Require Toss SDK deploy key
        env:
          TOSS_OPENAPI_DEPLOY_KEY: ${{ secrets.TOSS_OPENAPI_DEPLOY_KEY }}
        run: |
          if [ -z "${TOSS_OPENAPI_DEPLOY_KEY}" ]; then
            echo "::error::secret TOSS_OPENAPI_DEPLOY_KEY is missing (fork PRs get no secrets); Toss SDK tests cannot run"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: STOA-company/toss-openapi
          ssh-key: ${{ secrets.TOSS_OPENAPI_DEPLOY_KEY }}
          path: toss-openapi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # pyproject requires-python >=3.11
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -e ".[dev]" pydantic httpx pydantic-settings python-dotenv respx tenacity

      - name: Ruff
        run: ruff check .

      - name: Pytest (full suite, incl. Toss SDK)
        env:
          PYTHONPATH: src:toss-openapi/src
        run: |
          python -c "import toss_openapi" 
          python -m pytest -q tests
